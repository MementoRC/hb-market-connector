name: Security
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  schedule:
    - cron: '0 2 * * 0'   # weekly, Sunday 02:00 UTC (preserves existing cadence)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    uses: Claire-s-Monster/ci-framework/.github/workflows/reusable-security.yml@7d9deb1a46561154a3ab6bc2bdbc01cecb0355a9 # v4.4.2
    permissions:
      contents: read
      actions: read
      id-token: write
    secrets: inherit  # pragma: allowlist secret
