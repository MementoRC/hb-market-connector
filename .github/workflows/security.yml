name: Security
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  schedule:
    - cron: '0 2 * * 0'   # weekly, Sunday 02:00 UTC (preserves existing cadence)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    uses: Claire-s-Monster/ci-framework/.github/workflows/reusable-security.yml@247d5a6316065fbf55b37287d38c04077315c25c # fix/scorecard-v2.5.0-pin
    with:
      # v5: reusable-ci owns CodeQL on push/PR; keep the weekly/manual CodeQL scan here.
      codeql: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      actions: read
      id-token: write
      security-events: write
    secrets: inherit  # pragma: allowlist secret
