repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (pixi)
        entry: pixi run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format (pixi)
        entry: pixi run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy (pixi typecheck)
        entry: pixi run typecheck
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      # PEM header/footer literals and runtime-generated or dummy test keys; no key material
      - id: detect-private-key
        exclude: ^(market_connector/exchanges/coinbase/_auth_helpers\.py|tests/exchanges/coinbase/conftest\.py|tests/exchanges/coinbase/unit/test_auth_helpers\.py|tests/unit/auth/test_declarative_coverage\.py)$

  - repo: https://github.com/CoinAlpha/git-hooks
    rev: 78f0683233a09c68a072fd52740d32c0376d4f0f
    hooks:
      - id: detect-wallet-private-key
        types: [file]
        exclude: .json
