[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "hb-market-connector"
dynamic = ["version"]
description = "Live market connector adapter for Hummingbot — implements MarketAccessProtocol + TradingRulesProtocol from hb-strategy-framework"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "pydantic>=2",
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
hummingbot = ["hb-strategy-framework>=0.1.0"]
coinbase = [
    "pyjwt>=2.8",
    "cryptography>=41",
]
interactive-brokers = [
    "ib_async>=1.0.1,<2.0.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.10",
    "mypy>=1.20.0",
    "types-PyJWT",
]

[tool.hatch.version]
path = "market_connector/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["market_connector"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tool.pixi.dependencies]
python = "3.12.*"
pydantic = ">=2"
httpx = ">=0.27"
websockets = ">=12.0"

[tool.pixi.feature.dev.dependencies]
pytest = ">=9.0.3"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=7.1.0"
pytest-timeout = ">=2.2.0"
ruff = ">=0.15.10"
mypy = ">=1.5.1"
pre-commit = ">=2.15.0"

[tool.pixi.feature.ci.dependencies]
ruff = ">=0.15.10"
mypy = ">=1.5.1"
pytest = ">=9.0.3"
pytest-cov = ">=7.1.0"
pytest-timeout = ">=2.2.0"
bandit = ">=1.8.0"
pre-commit = ">=2.15.0"
hatchling = ">=1.18"

[tool.pixi.feature.coinbase.dependencies]
pyjwt = ">=2.8"
cryptography = ">=41"

[tool.pixi.feature.kraken.dependencies]
pyjwt = ">=2.8"
cryptography = ">=41"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.environments]
default = { features = ["py312", "dev"], solve-group = "default" }
ci = { features = ["py312", "ci", "coinbase", "dev"], solve-group = "default" }
quality-ci = { features = ["py312", "ci", "coinbase", "dev"], solve-group = "default" }
coinbase = { features = ["py312", "coinbase", "dev"], solve-group = "default" }
kraken = { features = ["py312", "kraken", "dev"], solve-group = "default" }
interactive-brokers = { features = ["py312", "interactive-brokers", "dev"], solve-group = "default" }
py312 = { features = ["py312", "coinbase", "dev"], solve-group = "py312" }

[tool.pixi.tasks]
kraken-symbol-audit = "python -m market_connector.exchanges.kraken.tools.symbol_audit"
test-kraken = "pytest tests/exchanges/kraken/ -v --tb=short"
test-kraken-specs = "pytest tests/exchanges/kraken/unit/test_specs.py -v --tb=long -p no:warnings"
test-kraken-factory = "pytest tests/exchanges/kraken/unit/test_factory.py -v --tb=long -p no:warnings"
test-kraken-vectors = "pytest tests/exchanges/kraken/unit/test_signature_vectors.py -v --tb=long -p no:warnings"
test-kraken-vectors-short = "pytest tests/exchanges/kraken/unit/test_signature_vectors.py -v --tb=line -p no:warnings"
test-kraken-vectors-log = "pytest tests/exchanges/kraken/unit/test_signature_vectors.py --tb=short -p no:warnings -q --junitxml=/tmp/kraken_vectors.xml"
lint-kraken = "ruff check market_connector/exchanges/kraken/ tests/exchanges/kraken/ --output-format=junit --output-file=/tmp/kraken_lint.xml"
lint-kraken-fix = "ruff check market_connector/exchanges/kraken/specs.py tests/exchanges/kraken/unit/test_signature_vectors.py --select=I --fix"
test = "pytest tests/"
test-unit = "pytest tests/unit/"
test-integration = "pytest tests/integration/"
test-conformance = "pytest tests/contract -v"
lint = "ruff check market_connector tests"
format = "ruff format market_connector tests"
format-check = "ruff format --check market_connector tests"
typecheck = "mypy market_connector"
build = "hatchling build"
quality = { depends-on = ["lint", "format-check"] }
check = { depends-on = ["quality", "typecheck", "test"] }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "ib_gateway: integration test requiring a running IB Gateway (Docker or local). Skipped by default; run with `-m ib_gateway`.",
]
timeout = 30
addopts = "--strict-markers --strict-config -v"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N", "SIM", "TCH"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
# Bare dict/list/Callable annotations (without type args) exist throughout Stage 1-3 code.
# Suppress [type-arg] globally; a dedicated annotation cleanup pass will follow
# once the Python 3.12 baseline transition is done.
disable_error_code = ["type-arg"]

# cryptography ships partial stubs; hazmat layer is not covered — ignore missing imports.
[[tool.mypy.overrides]]
module = "cryptography.*"
ignore_missing_imports = true

# ib_async is an optional dep (Interactive Brokers); no stubs available on PyPI.
[[tool.mypy.overrides]]
module = "ib_async.*"
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source_pkgs = ["market_connector"]
omit = ["market_connector/__about__.py", "market_connector/exchanges/coinbase/mixins/protocols.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = ["no cov", "if __name__", "if TYPE_CHECKING", "raise NotImplementedError", "@overload"]

[tool.hummingbot.supersedes]
module = "hummingbot.connector"
import_path = "market_connector"
test_paths = []
exchanges = []
